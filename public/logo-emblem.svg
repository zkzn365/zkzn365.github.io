<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="wheatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A67C49;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C4955A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1F4D3F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A8A5C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3A57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A6B8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F4D3F;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#A67C49;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#1A3A57;stop-opacity:0.35" />
    </linearGradient>
  </defs>

  <!-- ===== 环形服务闭环 ===== -->
  <circle cx="60" cy="52" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- 环上金色弧段 - 强调闭环感 -->
  <path d="M60 8 A44 44 0 0 1 104 52" fill="none" stroke="#A67C49" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M104 52 A44 44 0 0 1 60 96" fill="none" stroke="#1F4D3F" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
  <path d="M60 96 A44 44 0 0 1 16 52" fill="none" stroke="#1A3A57" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
  <path d="M16 52 A44 44 0 0 1 60 8" fill="none" stroke="#A67C49" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== 麦穗（左侧，从底部向右上弯曲）===== -->
  <path d="M38 72 Q30 52 34 36 Q37 26 44 20" stroke="url(#wheatGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 麦穗颗粒 - 左侧 -->
  <ellipse cx="32" cy="64" rx="6" ry="3" transform="rotate(-20 32 64)" fill="#A67C49" opacity="0.9"/>
  <ellipse cx="29" cy="55" rx="6" ry="3" transform="rotate(-30 29 55)" fill="#C4955A" opacity="0.9"/>
  <ellipse cx="29" cy="46" rx="5.5" ry="2.8" transform="rotate(-40 29 46)" fill="#C4955A" opacity="0.9"/>
  <ellipse cx="31" cy="38" rx="5" ry="2.5" transform="rotate(-50 31 38)" fill="#D4A853" opacity="0.9"/>
  <ellipse cx="36" cy="31" rx="4.5" ry="2.2" transform="rotate(-55 36 31)" fill="#D4A853" opacity="0.85"/>
  <ellipse cx="42" cy="26" rx="4" ry="2" transform="rotate(-60 42 26)" fill="#D4A853" opacity="0.8"/>

  <!-- 麦穗颗粒 - 右侧 -->
  <ellipse cx="44" cy="66" rx="6" ry="3" transform="rotate(10 44 66)" fill="#A67C49" opacity="0.85"/>
  <ellipse cx="42" cy="57" rx="6" ry="3" transform="rotate(5 42 57)" fill="#C4955A" opacity="0.85"/>
  <ellipse cx="41" cy="49" rx="5.5" ry="2.8" transform="rotate(0 41 49)" fill="#C4955A" opacity="0.85"/>
  <ellipse cx="42" cy="41" rx="5" ry="2.5" transform="rotate(-5 42 41)" fill="#D4A853" opacity="0.85"/>
  <ellipse cx="45" cy="35" rx="4" ry="2" transform="rotate(-15 45 35)" fill="#D4A853" opacity="0.8"/>
  <ellipse cx="50" cy="30" rx="3.5" ry="1.8" transform="rotate(-25 50 30)" fill="#D4A853" opacity="0.75"/>

  <!-- 麦穗顶部 -->
  <ellipse cx="47" cy="24" rx="2.5" ry="4" transform="rotate(-30 47 24)" fill="#D4A853" opacity="0.7"/>

  <!-- ===== 科技绿条（底部，3条由粗到细的弧线）===== -->
  <path d="M36 78 Q52 66 68 70 Q78 72 84 66" stroke="url(#greenGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M40 83 Q54 73 70 76 Q79 77 86 72" stroke="#2A7A4E" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M44 88 Q56 80 72 81 Q80 82 87 78" stroke="#3A8A5C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ===== 电路节点（右侧，蓝色弧线 + 末端圆点）===== -->
  <path d="M58 72 Q68 60 76 50 Q82 42 84 34" stroke="url(#blueGrad)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="84" cy="32" r="3" fill="#2A6B8A" opacity="0.9"/>
  <circle cx="85" cy="27" r="1.8" fill="#2A6B8A" opacity="0.55"/>

  <path d="M64 74 Q73 64 80 54 Q86 46 89 40" stroke="#1A3A57" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="89" cy="38" r="3" fill="#1A3A57" opacity="0.85"/>
  <circle cx="90" cy="33" r="1.8" fill="#1A3A57" opacity="0.5"/>

  <path d="M70 76 Q78 68 84 60 Q89 53 92 46" stroke="#2A6B8A" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <circle cx="92" cy="44" r="2.5" fill="#2A6B8A" opacity="0.7"/>
  <circle cx="93" cy="40" r="1.5" fill="#2A6B8A" opacity="0.4"/>

  <!-- 环上小节点 - 强化闭环意象 -->
  <circle cx="60" cy="8" r="2" fill="#A67C49" opacity="0.5"/>
  <circle cx="104" cy="52" r="2" fill="#1F4D3F" opacity="0.4"/>
  <circle cx="60" cy="96" r="2" fill="#1A3A57" opacity="0.4"/>
  <circle cx="16" cy="52" r="2" fill="#A67C49" opacity="0.4"/>
</svg>
